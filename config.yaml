# PS5 - fabric inspection configuration (camera, quality gate, paths, Llama advice).
# Per-fabric settings are in kb/fabric.yaml.

paths:
  kb_dir: kb                # fabric.yaml, fabric_guidance.yaml, calibration.json
  db: db/inspections.sqlite

camera:
  source: auto         # auto (Picamera2 else file) | picamera2 | usb | file
  width: 4056          # Pi HQ Camera full resolution
  height: 3040
  usb_index: 0         # source: usb -> /dev/video<usb_index>
  usb_size: [640, 480] # USB webcam (HP w100 maxes out at 640x480)
  usb_exposure: null   # fixed exposure (V4L2 units); null = leave camera setting
  usb_lock_wb: false   # true = switch auto white balance off (can cause a colour cast)
  calibration: kb/camera_calib.npz

quality:               # image-quality gate -> INVALID_CAPTURE when not met
  min_sharpness: 40      # variance of Laplacian at 1024 px width
  min_brightness: 35
  max_brightness: 225
  max_clipped: 0.10      # fraction of over/under-exposed pixels
  min_inliers: 40        # alignment matches
  max_reproj_px: 3.0     # alignment error

llm:
  enabled: true      # false = no Llama advice (rules only); true = Llama writes the operator note
  backend: auto        # auto (ExecuTorch if built + model present, else mock) | executorch | mock
  pte: models/llama3_2_1b_q8da4w_ctx512.pte
  tokenizer: models/tokenizer.model
  hf_repo: iffatirfana/pcb-inspect-ps5-models
  max_new_tokens: 64
  temperature: 0.2
  context_length: 480   # ctx512 .pte tested on the Pi up to a 469-token prompt; our prompt is about 300 tokens