# Defect definitions - used by the rule engine and fed to Llama as context.
# Names MUST match classifier.classes in config.yaml.

solder_bridge:
  name: Solder bridge
  description: Unwanted solder connecting two or more adjacent pads or pins.
  visual: Shiny solder blob spanning the gap between neighbouring pins/pads.
  typical_cause: Excess paste, stencil misalignment, insufficient pad spacing.
  risk: Short circuit between nets; can damage regulators or ICs at power-up.

missing_component:
  name: Missing component
  description: A component in the pick-and-place list is absent from its pads.
  visual: Bare or tinned pads with no part on them.
  typical_cause: Pick-up failure, feeder empty, part knocked off during handling.
  risk: Circuit function missing or open; may affect power, decoupling or signals.

tombstone:
  name: Tombstone
  description: A two-terminal chip part lifted on one end, standing upright.
  visual: Resistor/capacitor standing on one pad, other pad empty.
  typical_cause: Uneven heating or uneven paste volume between the two pads.
  risk: Open circuit at that component.

misalignment:
  name: Component misalignment
  description: Component shifted or rotated off its pads.
  visual: Leads/terminals partly off the pads; part visibly rotated.
  typical_cause: Placement offset, board vibration before reflow.
  risk: Weak or open joints; possible bridge to neighbouring pads.

wrong_polarity:
  name: Wrong polarity / orientation
  description: Polarised part (diode, LED, electrolytic, IC) placed the wrong way.
  visual: Pin-1 dot or polarity marking not matching the silkscreen marker.
  typical_cause: Reel loaded wrongly, manual placement error.
  risk: Device non-functional or destroyed at power-up.

insufficient_solder:
  name: Insufficient solder
  description: Joint has too little solder to form a proper fillet.
  visual: Dull, thin or incomplete fillet; pad copper visible.
  typical_cause: Low paste volume, blocked stencil aperture.
  risk: Weak or intermittent joint; may fail under vibration or heat.

excess_solder:
  name: Excess solder
  description: Joint has too much solder, ballooned fillet.
  visual: Large convex solder mass around the lead.
  typical_cause: Too much paste or rework solder.
  risk: Hidden bridge risk; poor inspection of joint quality.

solder_ball:
  name: Solder ball
  description: Small loose sphere of solder on the board surface.
  visual: Tiny shiny round dot near pads or on solder mask.
  typical_cause: Paste spatter, moisture in paste, fast reflow ramp.
  risk: Can move and short adjacent conductors if near them.

scratch:
  name: Scratch / mask damage
  description: Mechanical damage to solder mask or copper trace.
  visual: Line or scuff exposing copper or fibre.
  typical_cause: Handling, fixtures, tools.
  risk: Exposed copper may corrode; cut trace causes an open circuit.
unknown_anomaly:
  name: Unknown anomaly
  description: The board differs from the golden board here, but the classifier could not name it.
  visual: Any visible difference from the known-good board.
  typical_cause: Unseen defect type, debris, label/marking change, or glare.
  risk: Unknown - needs a human decision.

# ---- bare PCB defects (YOLO, board_type: bare) ----
open_circuit:
  name: Open circuit
  description: A copper trace is broken or missing a section.
  visual: Gap across a trace.
  typical_cause: Over-etching, scratch, dust on the photo-tool.
  risk: Net is disconnected; circuit will not work.

short_circuit:
  name: Short circuit (copper)
  description: Unwanted copper joins two traces or pads.
  visual: Copper bridge between neighbouring conductors.
  typical_cause: Under-etching, photo-resist defect.
  risk: Two nets connected; can damage parts at power-up.

mouse_bite:
  name: Mouse bite
  description: Small bites missing from the edge of a trace.
  visual: Notches along a conductor edge.
  typical_cause: Etching irregularities.
  risk: Reduced trace width; may fail under current or vibration.

spur:
  name: Spur
  description: Small copper protrusion from a trace or pad.
  visual: Thin copper finger sticking out of a conductor.
  typical_cause: Etching irregularities.
  risk: Reduced clearance; may short after assembly.

spurious_copper:
  name: Spurious copper
  description: Isolated copper where none should be.
  visual: Copper island between conductors.
  typical_cause: Under-etching, contamination.
  risk: Reduced clearance or short if near a conductor.

pin_hole:
  name: Pin hole
  description: Small hole in copper or plating.
  visual: Tiny void inside a pad or trace.
  typical_cause: Plating or laminate defect.
  risk: Usually cosmetic; large holes weaken the conductor.
