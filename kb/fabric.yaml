# Fabric inspection settings. Placeholders marked TUNE must be set from real photos.
fabric: blue                  # default fabric key below

fabrics:
  blue:
    detector: yolo            # yolo = YOLOv8-seg (Hole/Knot/Line/Stain); anomaly = heatmap detector
    yolo_model: models/best_a2.onnx    # 960x960 export (Ultralytics 8.4.215); previous model: best_169.onnx (640x384)
    yolo_conf: 0.5            # measured on our blue photos: 0 of 71 normals flagged at 0.5
    yolo_imgsz: 960
    px_per_mm: 6.0            # measured from ruler photo (1265x1600 px, 60.1 px per cm); valid only at this camera distance and image size
    calibrated: true          # ruler photo 2026-11-18; redo if camera distance or resolution changes
    crop: null
    backbone_onnx: models/fabric_backbone.onnx   # used only when detector: anomaly
    bank: models/bank_blue.npy
    threshold: 1.0            # TUNE: from Person 2's threshold_blue.txt
    # Second opinion (REVIEW-only): runs only when YOLO finds nothing; can raise PASS -> REVIEW, never more.
    # Backbone: ResNet18 layer2+layer3 (from Person 2). Bank: 5000 vectors, greedy coreset of the 51 blue
    # TRAIN photos only (no val/test/defect photos). Pixel threshold chosen on the 10 VAL photos only.
    # Held-out result: val 0/10 flagged, test 2/10 flagged, holes 15/15, threads 6/6 (small set, same fabric).
    anomaly:
      enabled: true
      backbone_onnx: models/anomaly/resnet18_fused.onnx
      bank: models/anomaly/bank_blue_trainonly.npy
      pixel_threshold: 2.463  # heatmap value above which a pixel counts as abnormal
      image_fraction: 0.015   # flag the photo when more than 1.5% of its pixels are abnormal
  white:
    px_per_mm: 8.0            # TUNE: from the ruler photo (px_per_mm_from_ruler)
    crop: null                # TUNE: [x, y, w, h] in camera pixels, or null for full frame
    backbone_onnx: models/fabric_backbone.onnx
    bank: models/bank_white.npy
    threshold: 1.0            # TUNE: from Person 2's threshold_white.txt
  purple:
    px_per_mm: 8.0
    crop: null
    backbone_onnx: models/fabric_backbone.onnx
    bank: models/bank_purple.npy
    threshold: 1.0            # TUNE: threshold_purple.txt

# Placeholders: tune on validation photos. Must match the SOP text below.
rules:
  min_area_mm2: 0.5
  low_max_mm2: 2.0
  medium_max_mm2: 10.0
  max_defects_for_review: 3

# Overrides config.yaml quality gate for fabric (PCB value 40 would reject most of our fabric photos:
# measured median sharpness of the blue set is about 38). TUNE after the final photo set.
quality:
  min_sharpness: 12

scorer:
  work_size: [512, 512]       # crop is resized to this before the backbone
  blur_ksize: 15              # heatmap smoothing (odd number)

# One operator instruction per verdict. The verdict itself is never decided by the LLM.
sop:
  PASS: "No defect found. Release the piece."
  REVIEW: "Small marks only. Operator checks by eye, then accepts or sends for rework."
  REWORK: "Mark the defect position. Repair or trim, then re-inspect."
  REJECT: "Large defect. Set the piece aside, record it, and do not release."
  generic: "Record the defect position and the operator decision."
